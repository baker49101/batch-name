name: Build macOS Portable

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-macos-portable:
    name: Build macOS portable app
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build macOS app
        run: tauri build --bundles app --no-sign

      - name: Ad-hoc sign macOS app
        run: |
          APP_PATH="$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' -type d | head -n 1)"
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found" >&2
            exit 1
          fi
          codesign --force --deep --sign - "$APP_PATH"

      - name: Package portable macOS app
        run: bash scripts/package-macos-portable.sh

      - name: Package macOS dmg
        run: bash scripts/package-macos-dmg.sh

      - name: Upload macOS portable app
        uses: actions/upload-artifact@v4
        with:
          name: quick-batch-renamer-macos-portable
          path: release-macos/*.zip
          if-no-files-found: error

      - name: Upload macOS dmg
        uses: actions/upload-artifact@v4
        with:
          name: quick-batch-renamer-macos-dmg
          path: release-macos/*.dmg
          if-no-files-found: error
